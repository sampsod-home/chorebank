name: Deploy to GitHub Pages

# Builds the Expo web export and publishes it to the `gh-pages` branch, which
# GitHub Pages serves at https://sampsod-home.github.io/chorebank/.
# (Pages "Source" is set to: Deploy from branch → gh-pages / root.)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Export web build
        run: npx expo export --platform web

      - name: Disable Jekyll (serve _expo/ assets as-is)
        run: touch dist/.nojekyll

      - name: Publish to gh-pages
        run: |
          cd dist
          git init -q
          git checkout -q -b gh-pages
          git add -A
          git -c user.name="github-actions[bot]" \
              -c user.email="github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Deploy ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
